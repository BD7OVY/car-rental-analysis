name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布到 GitHub Pages 所需的权限（标准配置）
permissions:
  contents: read
  pages: write          # 部署 Pages
  id-token: write       # 验证部署来源（OIDC）

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 首次推送时尝试通过 API 自动开启 Pages（来源 = GitHub Actions）。
      # 若仓库已开启则更新为 workflow 构建方式；若令牌权限不足会失败，
      # 此时需要仓库所有者到 Settings → Pages 手动选择 “GitHub Actions” 来源。
      - name: Enable GitHub Pages (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST /repos/${{ github.repository }}/pages -f build_type=workflow \
            || gh api -X PUT /repos/${{ github.repository }}/pages -f build_type=workflow

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          # 纯前端静态站点：根目录的 index.html + 离线依赖库 + data.json + schema_mapping.json
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
